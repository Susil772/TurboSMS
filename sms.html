<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMS Sender</title>
    <style>
        body { background: #0f172a; color: white; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .box { background: #1e293b; padding: 30px; border-radius: 15px; width: 320px; text-align: center; border: 1px solid #334155; }
        input { width: 90%; padding: 12px; margin: 10px 0; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: white; text-align: center; }
        button { width: 100%; padding: 12px; background: #38bdf8; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .back { display: block; margin-top: 15px; color: #94a3b8; text-decoration: none; font-size: 12px; }
    </style>
    
    <script>
        if(!localStorage.getItem("token")) {
            window.location.href = "login.html";
        }
    </script>
</head>
<body>
    <div class="box">
        <h2 style="color: #38bdf8;">📩 SMS Sender</h2>
        <input type="text" id="phone" placeholder="017xxxxxxxx">
        <button onclick="sendSMS()" id="btn">Send Code 🔥</button>
        <p id="status" style="margin-top:15px; min-height:20px;"></p>
        <a href="dashboard.html" class="back">← Back to Dashboard</a>
    </div>

    <script>
        async function sendSMS() {
            let phone = document.getElementById("phone").value;
            let status = document.getElementById("status");
            let btn = document.getElementById("btn");

            if(phone.length < 11) { status.innerText = "❌ নাম্বার ভুল!"; return; }

            status.innerText = "Processing... ⏳";
            btn.disabled = true;

            try {
                let res = await fetch('/api/sms', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phone: phone })
                });
                let data = await res.json();
                status.innerText = data.success ? "✅ Sent!" : "❌ Failed";
            } catch (e) {
                status.innerText = "❌ Error";
            }
            btn.disabled = false;
        }
    </script>
</body>
</html>
