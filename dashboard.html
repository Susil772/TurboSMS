<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <style>
        body { font-family: sans-serif; background: #0f172a; color: white; text-align: center; padding: 20px; }
        .container { max-width: 500px; margin: 0 auto; }
        .card { background: #1e293b; padding: 20px; margin: 15px 0; border-radius: 10px; display: flex; justify-content: space-between; text-decoration: none; color: white; border: 1px solid #334155; }
        .logout { background: #ef4444; border: none; padding: 10px 20px; color: white; border-radius: 5px; cursor: pointer; margin-top: 30px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>👋 Welcome User</h1>
        <p style="color: #4ade80;">Status: Active ✅</p>

        <a href="sms.html" class="card" style="border-left: 5px solid #00d2ff;">
            <span>📩 Open SMS Sender</span> <span>➔</span>
        </a>
        
        <a href="temp_mail.html" class="card" style="border-left: 5px solid #ff9f43;">
            <span>📧 Open Temp Mail</span> <span>➔</span>
        </a>

        <button onclick="logout()" class="logout">Logout</button>
    </div>

    <script>
        if(!localStorage.getItem("token")) window.location.href = "login.html";
        function logout() { localStorage.clear(); window.location.href = "index.html"; }
    </script>
</body>
</html>
